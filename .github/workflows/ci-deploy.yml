name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The API tests start a real PostgreSQL with Testcontainers; the runner has Docker.
      - run: ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Builds the two images and pushes them to GitHub's container registry. Only on main, only after the tests pass.
  images:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        # Registry names must be lowercase.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}/backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}/web:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}/web:latest

  # Copies the compose file to the server and starts the new images. Needs three repository secrets:
  # DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY.
  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Secrets go in as environment variables, not pasted into the scripts below.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
      IMAGE_PREFIX: ${{ needs.images.outputs.prefix }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up the SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Copy the compose file
        run: scp -i ~/.ssh/id_deploy deploy/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/aquarium/compose.yaml"
      - name: Pull and restart
        # The registry login is only needed for this pull; the images stay on the server afterwards.
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/aquarium \
             && echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$REGISTRY_USER' --password-stdin \
             && IMAGE_PREFIX='$IMAGE_PREFIX' TAG='$TAG' docker compose up -d --pull always \
             && docker image prune -f"
