spring.application.name=aquarium

# Local defaults match compose.yaml at the repo root; production overrides them with environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aquarium}
spring.datasource.username=${DATABASE_USER:aquarium}
spring.datasource.password=${DATABASE_PASSWORD:aquarium}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Behind Caddy: take the client address and the scheme from X-Forwarded-For and X-Forwarded-Proto. Tomcat only
# believes them from a proxy on a private network (the compose network), and Caddy replaces what a client sends.
# The login and signup limits count by this address, and the backend sees HTTPS (Secure XSRF cookie, HSTS).
server.forward-headers-strategy=native

# Base of the links in emails. Production sets PUBLIC_URL to the site's address.
app.public-url=${PUBLIC_URL:http://localhost:5173}

# "Keep me logged in": the session cookie lasts 30 days instead of dying with the browser window. A login with
# remember=false strips the Max-Age again (SessionController).
# Production sets SESSION_COOKIE_SECURE=true so the cookie only travels over HTTPS.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# The id of the one Tank anyone may read (the Demo Tank). Empty leaves the flag as it is.
app.demo-tank-id=${DEMO_TANK_ID:}

# Tank Photos. The files go to a folder (PhotoStorage); production points it at a persistent disk. The quota counts
# the stored files of one user. An upload may weigh 10 MB (the form fields need a little room on top).
app.photos.dir=${PHOTOS_DIR:./data/photos}
app.photos.quota-bytes=${PHOTOS_QUOTA_BYTES:209715200}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Lets the server read (and drop) an upload that is over the limit, so the client gets the 413 and not a reset.
server.tomcat.max-swallow-size=20MB

# Email. Without SMTP_HOST the emails are only written to the log (LoggingEmailSender). Production sets SMTP_HOST,
# SMTP_PORT, SMTP_USER and SMTP_PASSWORD from the provider's dashboard, and MAIL_FROM to an address on the site's own domain.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# JavaMail waits forever by default. These keep a mail server that hangs from holding a request thread for long.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:Biotopia <noreply@localhost>}
management.health.mail.enabled=false
